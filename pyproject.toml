[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phpscan"
version = "1.7.2"
description = "Free external PHP vulnerability scanner (php2shell / CVE-2026-109618, CVE-2026-109619) — passive fingerprinting plus limited, read-only path checks. No exploit probes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Superstar Telecom LLC" }]

[project.scripts]
phpscan = "phpscan.__main__:cli"

[tool.setuptools]
packages = ["phpscan"]

[tool.setuptools.package-data]
phpscan = ["data/*.json"]
