name: docker

# Build the phpscan image and publish it to GHCR when a GitHub
# Release is published: ghcr.io/phpatch/phpscan:<tag> and :latest.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs where this repo already has
      # them (supply-chain hygiene); docker/* actions are
      # referenced by major version tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/phpatch/phpscan:${{ github.ref_name }}
            ghcr.io/phpatch/phpscan:latest
